<main>
  <h1>進行聴き比べ（新規ページ）</h1>
  <p class="lead">2つの進行を同じキー・BPMでループ再生し、ワンタップで切り替えて響きの違いを体感する（簡易実装版）。</p>

  <section class="panel">
    <div class="row">
      <label class="field">進行A<select id="presetA"></select></label>
      <label class="field">進行B<select id="presetB"></select></label>
      <label class="field">キー<select id="keySelect"></select></label>
      <label class="field">BPM <span id="bpmLabel">100</span>
        <input type="range" id="bpmRange" min="60" max="160" value="100">
      </label>
    </div>
    <div class="row" style="margin-top:10px;">
      <button id="loopBtn" class="primary">ループ再生 ▶</button>
      <button id="switchBtn">A/B 切り替え</button>
      <button id="stopBtn">■ 停止</button>
      <span id="activeLabel" style="color:var(--accent-2); font-weight:bold;"></span>
    </div>
  </section>

  <div class="row" style="align-items:flex-start; gap:16px;">
    <div class="progression-card" id="cardA" style="flex:1; min-width:280px;"></div>
    <div class="progression-card" id="cardB" style="flex:1; min-width:280px;"></div>
  </div>

  <footer class="note">※簡易実装のため、A/B切り替えは現在のループを止めて即座に切り替える方式です（企画書の「テンポを止めずに切り替える」の完全な実装は今後の課題）。色が付いたコードブロックが2進行の違う箇所です。</footer>
</main>
